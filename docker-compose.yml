services:
  postgres:
    image: postgres:16-alpine
    container_name: appolitica-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: appolitica
      POSTGRES_PASSWORD: appolitica
      POSTGRES_DB: appolitica
    volumes:
      - appolitica_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appolitica -d appolitica"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  appolitica_pg_data:
